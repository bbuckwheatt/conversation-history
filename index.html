<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Portal - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="logo">
                <h1>🤖 AI Chatbot Portal</h1>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username"
                        required
                        autocomplete="off"
                    >
                </div>
                <button type="submit" class="login-btn">
                    <span>Enter Portal</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </form>
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">💬</span>
                    <span>AI-Powered Conversations</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🔒</span>
                    <span>Secure & Private</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">⚡</span>
                    <span>Real-time Responses</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script defer src="https://cdn.customgpt.ai/js/chat.js"></script>
    <script defer>
        (function(){
            function init(){
                // Only initialize on the login page (check for loginForm)
                if (document.getElementById('loginForm')) {
                    CustomGPT.init({
                        p_id:'77811',
                        p_key:'af28a7a93c6e958e50e89db12e2635c7'
                    });
                }
            }
            document.readyState === 'complete' ? init() : window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
